name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          # Linux AMD64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o go-pve-vdi-linux-amd64

          # Linux 386
          GOOS=linux GOARCH=386 CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o go-pve-vdi-linux-386

          # Linux ARM64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o go-pve-vdi-linux-arm64

          # Linux ARM
          GOOS=linux GOARCH=arm CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o go-pve-vdi-linux-arm

          # macOS AMD64
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o go-pve-vdi-darwin-amd64

          # macOS ARM64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o go-pve-vdi-darwin-arm64

          # Windows AMD64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o go-pve-vdi-windows-amd64.exe

          # Windows 386
          GOOS=windows GOARCH=386 CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${{ steps.get_version.outputs.VERSION }}" -o go-pve-vdi-windows-386.exe

      - name: Create checksums
        run: |
          sha256sum go-pve-vdi-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            go-pve-vdi-linux-amd64
            go-pve-vdi-linux-386
            go-pve-vdi-linux-arm64
            go-pve-vdi-linux-arm
            go-pve-vdi-darwin-amd64
            go-pve-vdi-darwin-arm64
            go-pve-vdi-windows-amd64.exe
            go-pve-vdi-windows-386.exe
            checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
